<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TRAVEL FIT｜あなたの条件から海外旅行先を診断</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: #263238;
      background: #ffffff;
    }

    header {
      padding: 22px 8%;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .hero {
      min-height: 72vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 70px 20px;
      background: linear-gradient(
        180deg,
        #eaf8f6 0%,
        #ffffff 100%
      );
    }

    .hero-inner {
      max-width: 760px;
    }

    .small-title {
      font-size: 15px;
      color: #16877d;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(34px, 7vw, 60px);
      line-height: 1.25;
      margin: 0 0 24px;
    }

    .highlight {
      color: #16877d;
    }

    .description {
      font-size: 17px;
      line-height: 1.9;
      color: #546e7a;
      margin-bottom: 35px;
    }

    .start-button {
      display: inline-block;
      padding: 18px 42px;
      background: #16877d;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(22, 135, 125, 0.22);
    }

    .note {
      margin-top: 15px;
      font-size: 13px;
      color: #78909c;
    }

    .features {
      max-width: 1000px;
      margin: auto;
      padding: 80px 20px 100px;
    }

    .features h2 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 45px;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .feature {
      background: #f7faf9;
      border-radius: 18px;
      padding: 28px;
    }

    .feature-icon {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .feature h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .feature p {
      margin: 0;
      line-height: 1.7;
      color: #607d8b;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #90a4ae;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .feature-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        min-height: 65vh;
      }
    }
  </style>
</head>

<body>

  <header>
    TRAVEL FIT
  </header>

  <main>

    <section class="hero">
      <div class="hero-inner">

        <div class="small-title">
          海外旅行先診断
        </div>

        <h1>
          あなたの条件に、<br>
          <span class="highlight">旅をフィット。</span>
        </h1>

        <p class="description">
          「どこに行きたい？」だけでは、なかなか決められない。<br>
          予算・日数・季節・一人旅・英語力・やりたいことから、<br>
          あなたの条件に合う海外旅行先を探します。
        </p>

        <a class="start-button" href="#">
          旅行先を診断する →
        </a>

        <div class="note">
          約3分・無料
        </div>

      </div>
    </section>

    <section class="features">

      <h2>こんな条件から探せます</h2>

      <div class="feature-grid">

        <div class="feature">
          <div class="feature-icon">💰</div>
          <h3>予算から</h3>
          <p>
            航空券や宿泊費を含めて、
            自分の予算で行ける旅行先を探します。
          </p>
        </div>

        <div class="feature">
          <div class="feature-icon">📅</div>
          <h3>日数・季節から</h3>
          <p>
            旅行できる日数や時期から、
            無理の少ない旅行先を探します。
          </p>
        </div>

        <div class="feature">
          <div class="feature-icon">🧳</div>
          <h3>旅行スタイルから</h3>
          <p>
            一人旅、英語力、街歩き、世界遺産、
            自然などの好みも診断に反映します。
          </p>
        </div>

      </div>

    </section>

  </main>

  <footer>
    © 2026 TRAVEL FIT
  </footer>

</body>
</html>
