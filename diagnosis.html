<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>海外旅行先診断｜TRAVEL FIT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: #263238;
      background: #f7fbfa;
    }

    header {
      padding: 22px 8%;
      background: #ffffff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .container {
      width: min(92%, 680px);
      margin: 45px auto;
    }

    .progress-text {
      color: #16877d;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .progress {
      width: 100%;
      height: 8px;
      background: #dcebe8;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 45px;
    }

    .progress-bar {
      height: 100%;
      background: #16877d;
      transition: width 0.3s ease;
    }

    h1 {
      font-size: 28px;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .subtext {
      color: #78909c;
      margin-bottom: 30px;
      line-height: 1.7;
    }

    .options {
      display: grid;
      gap: 13px;
    }

    .option {
      width: 100%;
      padding: 19px 20px;
      background: #ffffff;
      border: 2px solid #dce8e6;
      border-radius: 14px;
      text-align: left;
      font-size: 16px;
      color: #37474f;
      cursor: pointer;
      transition: 0.2s;
    }

    .option:hover {
      border-color: #16877d;
    }

    .option.selected {
      background: #e7f6f3;
      border-color: #16877d;
      color: #126d65;
      font-weight: 700;
    }

    .next-button {
      width: 100%;
      margin-top: 35px;
      padding: 18px;
      border: 0;
      border-radius: 999px;
      background: #c5d5d2;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: not-allowed;
    }

    .next-button.active {
      background: #16877d;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(22, 135, 125, 0.20);
    }

    .back-button {
      display: block;
      width: 100%;
      margin-top: 18px;
      border: 0;
      background: transparent;
      color: #78909c;
      font-size: 14px;
      cursor: pointer;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #78909c;
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        margin-top: 30px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    TRAVEL FIT
  </header>

  <main class="container">

    <div class="progress-text" id="progressText">
      Q1 / 15
    </div>

    <div class="progress">
      <div
        class="progress-bar"
        id="progressBar"
        style="width: 6.67%;">
      </div>
    </div>

    <h1 id="questionTitle">
      どこから出発しますか？
    </h1>

    <p class="subtext" id="questionDescription">
      航空券の価格や移動時間の目安に使用します。
    </p>

    <div class="options" id="options"></div>

    <button class="next-button" id="nextButton">
      次へ →
    </button>

    <button
      class="back-button"
      id="backButton"
      style="display:none;">
      ← 前の質問へ
    </button>

    <a class="back-home" href="index.html">
      ← トップページへ戻る
    </a>

  </main>

  <script>

    const questions = [

        ]
      },

      {

        key: "budget",

          { label: "15～20万円", value: "15to20" },
          { label: "20～30万円", value: "20to30" },
          { label: "30～40万円", value: "30to40" },
          { label: "40～50万円", value: "40to50" },
          { label: "50～70万円", value: "50to70" },

        ]
            },
            {

        description:
          "旅行スタイルや移動のしやすさの判定に使用します。",
        key: "companion",

        options: [
          { label: "一人旅", value: "solo" },
          { label: "友人と", value: "friends" },
          { label: "パートナー・夫婦で", value: "couple" },
          { label: "家族と", value: "family" }
        ]
                },
            {

        description:
          "旅の難易度や、個人旅行のしやすさを判定する参考にします。",
        key: "experience",

        options: [
          { label: "初めて", value: "first" },
          { label: "1～2回", value: "beginner" },
          { label: "3～5回", value: "intermediate" },
          { label: "6～10回", value: "experienced" },
          { label: "11回以上", value: "veryExperienced" }
        ]
      },
      {
  title: "英語でのコミュニケーションはどのくらいできますか？",
  description:
    "現地での移動や、旅行のしやすさを判定する参考にします。",
  key: "english",

  options: [
    { label: "ほとんど話せない", value: "none" },
    { label: "簡単な単語なら分かる", value: "basic" },
    { label: "簡単な会話ができる", value: "conversation" },
    { label: "日常会話に困らない", value: "good" }
  ]
},
      {
  title: "旅行先の気候はどれが好みですか？",
  description:
    "旅行する時期に、快適に過ごせる旅行先を判定する参考にします。",
  key: "climate",

  options: [
    { label: "暖かい・暑い場所が好き", value: "warm" },
    { label: "涼しい場所が好き", value: "cool" },
    { label: "寒い場所も大丈夫", value: "cold" },
    { label: "気候はあまり気にしない", value: "any" }
  ]
},
      {
  title: "旅行で何を一番楽しみたいですか？",
  description:
    "あなたが旅行先で重視したいことを、旅行先との相性判定に使用します。",
  key: "purpose",

  options: [
    { label: "世界遺産・歴史・文化", value: "heritage" },
    { label: "街歩き・観光", value: "city" },
    { label: "自然・絶景", value: "nature" },
    { label: "グルメ", value: "food" },
    { label: "ビーチ・リゾート", value: "beach" },
    { label: "アクティビティ・冒険", value: "activity" },
    { label: "ショッピング", value: "shopping" }
  ]
},
      {
  title: "旅行ではどのくらいのペースで観光したいですか？",
  description:
    "観光地の数や移動量など、あなたに合った旅程を判定する参考にします。",
  key: "pace",

  options: [
    { label: "ゆったり過ごしたい", value: "relaxed" },
    { label: "ほどよく観光したい", value: "balanced" },

  ]
  },
        {

      "都市間の移動回数や、周遊旅行との相性を判定する参考にします。",

    options: [

    ]
    },
        {
    title: "ホテルはどのくらいのレベルを希望しますか？",
    description:
      "宿泊費の目安や、旅行全体の予算を判定する参考にします。",
    key: "hotel",

    options: [
      { label: "安さ重視", value: "budget" },
      { label: "標準的なホテル", value: "standard" },
      { label: "少し良いホテル", value: "comfort" },
      { label: "高級ホテル", value: "luxury" }
    ]
    },
        {
    title: "旅行中の食事にどのくらいお金をかけたいですか？",
    description:
      "食費の目安や、旅行全体の予算を判定する参考にします。",
    key: "foodBudget",

    options: [
      { label: "できるだけ節約したい", value: "budget" },
      { label: "普段は手頃なお店で食べたい", value: "standard" },
      { label: "現地グルメもしっかり楽しみたい", value: "enjoy" },
      { label: "食事にはお金をかけたい", value: "luxury" }
    ]
    },
        {
    title: "旅先ではどのくらい冒険してみたいですか？",
    description:
      "旅先の難易度や、少し珍しい旅行先との相性を判定する参考にします。",
    key: "adventure",

    options: [
      { label: "安心・快適さを重視したい", value: "safe" },
      { label: "少しだけ冒険してみたい", value: "light" },
      { label: "多少大変でも珍しい場所へ行きたい", value: "adventure" },
      { label: "かなり冒険的な旅でも大丈夫", value: "highAdventure" }
    ]
      },
        {
    title: "旅行先を選ぶとき、避けたい条件はありますか？",
    description:
      "あなたが苦手な条件を避けて、より旅行しやすい行き先を判定する参考にします。",
    key: "avoid",

    options: [
      { label: "寒い場所", value: "cold" },
      { label: "暑い場所", value: "hot" },
      { label: "長時間のフライト", value: "longFlight" },
      { label: "乗り継ぎが多い", value: "transfers" },
      { label: "夜行列車・夜行バス", value: "nightTransport" },
      { label: "治安面の不安が大きい", value: "safety" },
      { label: "英語でのやり取りが多い", value: "english" },
      { label: "物価が高い", value: "expensive" },
      { label: "観光客が多く混雑している", value: "crowds" },
      { label: "特になし", value: "none" }
    ]
  }
    ];


    let currentQuestion = 0;

    const answers = {};


    const progressText =
      document.getElementById("progressText");

    const progressBar =
      document.getElementById("progressBar");

    const questionTitle =
      document.getElementById("questionTitle");

    const questionDescription =
      document.getElementById("questionDescription");

    const optionsContainer =
      document.getElementById("options");

    const nextButton =
      document.getElementById("nextButton");

    const backButton =
      document.getElementById("backButton");


    function showQuestion() {

      const question =
        questions[currentQuestion];


      progressText.textContent =
        "Q" + (currentQuestion + 1) + " / 15";


      progressBar.style.width =
        ((currentQuestion + 1) / 15 * 100) + "%";


      questionTitle.textContent =
        question.title;


      questionDescription.textContent =
        question.description;


      optionsContainer.innerHTML = "";


      question.options.forEach(option => {

        const button =
          document.createElement("button");

        button.className = "option";

        button.textContent =
          option.label;


        if (
          answers[question.key] === option.value
        ) {
          button.classList.add("selected");
        }


        button.addEventListener(
          "click",
          function () {

            answers[question.key] =
              option.value;

            showQuestion();

          }
        );


        optionsContainer.appendChild(button);

      });


      if (answers[question.key]) {

        nextButton.classList.add("active");

      } else {

        nextButton.classList.remove("active");

      }


      if (currentQuestion === 0) {

        backButton.style.display = "none";

      } else {

        backButton.style.display = "block";

      }

    }


    nextButton.addEventListener(
      "click",
      function () {

        const question =
          questions[currentQuestion];


        if (!answers[question.key]) {
          return;
        }


        localStorage.setItem(
          "travelFitAnswers",
          JSON.stringify(answers)
        );


        if (
          currentQuestion <
          questions.length - 1
        ) {

          currentQuestion++;

          showQuestion();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        } else {

          alert(
            "Q15まで正常に回答できました！"
          );

        }

      }
    );


    backButton.addEventListener(
      "click",
      function () {

        if (currentQuestion > 0) {

          currentQuestion--;

          showQuestion();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }

      }
    );

const destinations = [
  {
    name: "ポルトガル",
    code: "portugal"
  }
];

showQuestion();
    

  </script>

</body>
</html>
