<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>海外旅行先診断｜TRAVEL FIT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: #263238;
      background: #f7fbfa;
    }

    header {
      padding: 22px 8%;
      background: #ffffff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .container {
      width: min(92%, 680px);
      margin: 45px auto;
    }

    .progress-text {
      color: #16877d;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .progress {
      width: 100%;
      height: 8px;
      background: #dcebe8;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 45px;
    }

    .progress-bar {
      width: 6.67%;
      height: 100%;
      background: #16877d;
    }

    h1 {
      font-size: 28px;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .subtext {
      color: #78909c;
      margin-bottom: 30px;
      line-height: 1.7;
    }

    .options {
      display: grid;
      gap: 13px;
    }

    .option {
      width: 100%;
      padding: 19px 20px;
      background: #ffffff;
      border: 2px solid #dce8e6;
      border-radius: 14px;
      text-align: left;
      font-size: 16px;
      color: #37474f;
      cursor: pointer;
      transition: 0.2s;
    }

    .option:hover {
      border-color: #16877d;
    }

    .option.selected {
      background: #e7f6f3;
      border-color: #16877d;
      color: #126d65;
      font-weight: 700;
    }

    .next-button {
      width: 100%;
      margin-top: 35px;
      padding: 18px;
      border: 0;
      border-radius: 999px;
      background: #c5d5d2;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: not-allowed;
    }

    .next-button.active {
      background: #16877d;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(22, 135, 125, 0.20);
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #78909c;
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        margin-top: 30px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    TRAVEL FIT
  </header>

  <main class="container">

    <div class="progress-text">
      Q1 / 15
    </div>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <h1>どこから出発しますか？</h1>

    <p class="subtext">
      航空券の価格や移動時間の目安に使用します。
    </p>

    <div class="options">

      <button class="option" data-value="tokyo">
        東京（羽田・成田）
      </button>

      <button class="option" data-value="osaka">
        大阪（関西）
      </button>

      <button class="option" data-value="nagoya">
        名古屋（中部）
      </button>

      <button class="option" data-value="fukuoka">
        福岡
      </button>

      <button class="option" data-value="other">
        その他
      </button>

    </div>

    <button class="next-button" id="nextButton">
      次へ →
    </button>

    <a class="back-home" href="index.html">
      ← トップページへ戻る
    </a>

  </main>

  <script>
    const options = document.querySelectorAll(".option");
    const nextButton = document.getElementById("nextButton");

    let selectedDeparture = "";

    options.forEach(option => {
      option.addEventListener("click", () => {

        options.forEach(item => {
          item.classList.remove("selected");
        });

        option.classList.add("selected");
        selectedDeparture = option.dataset.value;

        nextButton.classList.add("active");
      });
    });

    nextButton.addEventListener("click", () => {
      if (!selectedDeparture) {
        return;
      }

      localStorage.setItem(
        "travelFitDeparture",
        selectedDeparture
      );

      alert(
        "出発地を保存しました！\n次の工程でQ2を作ります。"
      );
    });
  </script>

</body>
</html>
