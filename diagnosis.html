<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>海外旅行先診断｜TRAVEL FIT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: #263238;
      background: #f7fbfa;
    }

    header {
      padding: 22px 8%;
      background: #ffffff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .container {
      width: min(92%, 680px);
      margin: 45px auto;
    }

    .progress-text {
      color: #16877d;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .progress {
      width: 100%;
      height: 8px;
      background: #dcebe8;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 45px;
    }

    .progress-bar {
      height: 100%;
      background: #16877d;
      transition: width 0.3s ease;
    }

    h1 {
      font-size: 28px;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .subtext {
      color: #78909c;
      margin-bottom: 30px;
      line-height: 1.7;
    }

    .options {
      display: grid;
      gap: 13px;
    }

    .option {
      width: 100%;
      padding: 19px 20px;
      background: #ffffff;
      border: 2px solid #dce8e6;
      border-radius: 14px;
      text-align: left;
      font-size: 16px;
      color: #37474f;
      cursor: pointer;
      transition: 0.2s;
    }

    .option:hover {
      border-color: #16877d;
    }

    .option.selected {
      background: #e7f6f3;
      border-color: #16877d;
      color: #126d65;
      font-weight: 700;
    }

    .next-button {
      width: 100%;
      margin-top: 35px;
      padding: 18px;
      border: 0;
      border-radius: 999px;
      background: #c5d5d2;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: not-allowed;
    }

    .next-button.active {
      background: #16877d;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(22, 135, 125, 0.20);
    }

    .back-button {
      display: block;
      width: 100%;
      margin-top: 18px;
      border: 0;
      background: transparent;
      color: #78909c;
      font-size: 14px;
      cursor: pointer;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #78909c;
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        margin-top: 30px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    TRAVEL FIT
  </header>

  <main class="container">

    <div class="progress-text" id="progressText">
      Q1 / 15
    </div>

    <div class="progress">
      <div
        class="progress-bar"
        id="progressBar"
        style="width: 6.67%;">
      </div>
    </div>

    <h1 id="questionTitle">
      どこから出発しますか？
    </h1>

    <p class="subtext" id="questionDescription">
      航空券の価格や移動時間の目安に使用します。
    </p>

    <div class="options" id="options"></div>

    <button class="next-button" id="nextButton">
      次へ →
    </button>

    <button
      class="back-button"
      id="backButton"
      style="display:none;">
      ← 前の質問へ
    </button>

    <a class="back-home" href="index.html">
      ← トップページへ戻る
    </a>

  </main>

  <script>

    const questions = [

      {
        title: "どこから出発しますか？",
        description:
          "航空券の価格や移動時間の目安に使用します。",
        key: "departure",

        options: [
          {
            label: "東京（羽田・成田）",
            value: "tokyo"
          },
          {
            label: "大阪（関西）",
            value: "osaka"
          },
          {
            label: "名古屋（中部）",
            value: "nagoya"
          },
          {
            label: "福岡",
            value: "fukuoka"
          },
          {
            label: "その他",
            value: "other"
          }
        ]
      },

      {
        title: "いつ旅行する予定ですか？",
        description:
          "気候や旅行費用、ベストシーズンの判定に使用します。",
        key: "month",

        options: [
          { label: "1月", value: "1" },
          { label: "2月", value: "2" },
          { label: "3月", value: "3" },
          { label: "4月", value: "4" },
          { label: "5月", value: "5" },
          { label: "6月", value: "6" },
          { label: "7月", value: "7" },
          { label: "8月", value: "8" },
          { label: "9月", value: "9" },
          { label: "10月", value: "10" },
          { label: "11月", value: "11" },
          { label: "12月", value: "12" }
        ]
      }

    ];


    let currentQuestion = 0;

    const answers = {};


    const progressText =
      document.getElementById("progressText");

    const progressBar =
      document.getElementById("progressBar");

    const questionTitle =
      document.getElementById("questionTitle");

    const questionDescription =
      document.getElementById("questionDescription");

    const optionsContainer =
      document.getElementById("options");

    const nextButton =
      document.getElementById("nextButton");

    const backButton =
      document.getElementById("backButton");


    function showQuestion() {

      const question =
        questions[currentQuestion];


      progressText.textContent =
        "Q" + (currentQuestion + 1) + " / 15";


      progressBar.style.width =
        ((currentQuestion + 1) / 15 * 100) + "%";


      questionTitle.textContent =
        question.title;


      questionDescription.textContent =
        question.description;


      optionsContainer.innerHTML = "";


      question.options.forEach(option => {

        const button =
          document.createElement("button");

        button.className = "option";

        button.textContent =
          option.label;


        if (
          answers[question.key] === option.value
        ) {
          button.classList.add("selected");
        }


        button.addEventListener(
          "click",
          function () {

            answers[question.key] =
              option.value;

            showQuestion();

          }
        );


        optionsContainer.appendChild(button);

      });


      if (answers[question.key]) {

        nextButton.classList.add("active");

      } else {

        nextButton.classList.remove("active");

      }


      if (currentQuestion === 0) {

        backButton.style.display = "none";

      } else {

        backButton.style.display = "block";

      }

    }


    nextButton.addEventListener(
      "click",
      function () {

        const question =
          questions[currentQuestion];


        if (!answers[question.key]) {
          return;
        }


        localStorage.setItem(
          "travelFitAnswers",
          JSON.stringify(answers)
        );


        if (
          currentQuestion <
          questions.length - 1
        ) {

          currentQuestion++;

          showQuestion();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        } else {

          alert(
            "Q2まで正常に回答できました！"
          );

        }

      }
    );


    backButton.addEventListener(
      "click",
      function () {

        if (currentQuestion > 0) {

          currentQuestion--;

          showQuestion();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }

      }
    );


    showQuestion();

  </script>

</body>
</html>
